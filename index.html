<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deutsch B1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
:root{--bl:#007AFF;--gr:#34C759;--rd:#FF3B30;--or:#FF9500;--pu:#AF52DE;--bg:#F2F2F7;--cd:#FFF;--t1:#000;--t2:#3C3C43;--t3:#8E8E93;--t4:#C7C7CC;--sep:rgba(60,60,67,.18);--r:14px;--safe:env(safe-area-inset-bottom,0px)}
html,body{height:100%;background:var(--bg);color:var(--t1);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;outline:none}
input{font-family:inherit;-webkit-user-select:auto;user-select:auto}
#app{min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,16px)}
/* HEADER */
.hdr{background:linear-gradient(135deg,#007AFF,#5856D6);padding:20px 16px 22px;color:#fff;position:relative}
.hdr-title{font-size:24px;font-weight:800;margin-bottom:4px}
.hdr-sub{font-size:13px;opacity:.8;margin-bottom:12px}
.hdr-bar{height:7px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.hdr-fill{height:100%;background:#fff;border-radius:4px;transition:width .6s ease}
.hdr-row{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;opacity:.75}
/* STATS */
.stats{display:flex;gap:8px;padding:14px 16px 6px}
.stat{flex:1;background:var(--cd);border-radius:var(--r);padding:11px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.stat-v{font-size:22px;font-weight:700}
.stat-l{font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;font-weight:600;letter-spacing:.3px}

/* ── STAGE OVERLAY ── */
#stage{position:fixed;inset:0;z-index:100;display:none;flex-direction:column}
#stage.on{display:flex}
/* STAGE HEADER */
.st-hdr{flex-shrink:0;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.st-back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.st-back svg{width:20px;height:20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.st-info{flex:1}
.st-title{font-size:14px;font-weight:700;margin-bottom:2px}
.st-subtitle{font-size:12px;opacity:.7}
.st-prog{flex-shrink:0;height:4px;margin:0 16px 4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.2)}
.st-prog-fill{height:100%;border-radius:2px;transition:width .3s ease}
.st-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
/* ── STAGE 1: FLASHCARDS ── */
#s1{background:#1C1C1E;color:#fff}
#s1 .st-back{background:rgba(255,255,255,.1);stroke:#fff}
#s1 .st-prog{background:rgba(255,255,255,.15)}
#s1 .st-prog-fill{background:var(--gr)}
.fc-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px;touch-action:pan-y;position:relative}
.fc-wrap{width:100%;max-width:380px;position:relative}
.fc-card{width:100%;height:260px;border-radius:22px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;text-align:center}
.fc-front{background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.fc-back{background:#0f2027;border:1.5px solid rgba(100,210,120,.3);box-shadow:0 12px 40px rgba(0,0,0,.5);transform:rotateY(180deg)}
.fc-de{font-size:26px;font-weight:700;color:#1C1C1E;line-height:1.3;margin-bottom:8px}
.fc-ex{font-size:13px;color:#636366;line-height:1.5;font-style:italic}
.fc-ua{font-size:22px;font-weight:600;color:#5AEA80;line-height:1.3;margin-bottom:8px}
.fc-ex-ua{font-size:12px;color:rgba(255,255,255,.4);line-height:1.5;font-style:italic}
.fc-ind{position:absolute;top:18px;font-size:13px;font-weight:700;opacity:0;border-radius:10px;padding:5px 12px;pointer-events:none;transition:opacity .08s;z-index:5}
.fc-ind.kn{right:18px;background:rgba(52,199,89,.2);color:#5AEA80;border:1.5px solid rgba(52,199,89,.4)}
.fc-ind.ag{left:18px;background:rgba(255,59,48,.15);color:#FF8080;border:1.5px solid rgba(255,59,48,.35)}
.fc-arrows{display:flex;justify-content:space-between;width:100%;max-width:380px;padding:10px 0 0}
.fc-arr-l{font-size:12px;color:rgba(255,100,100,.5)}
.fc-arr-r{font-size:12px;color:rgba(100,210,120,.5)}
.fc-btns{flex-shrink:0;display:flex;gap:12px;padding:12px 20px calc(12px + var(--safe))}
.fc-btn{flex:1;padding:16px;border-radius:14px;font-size:15px;font-weight:700;min-height:52px;cursor:pointer}
.fc-btn:active{opacity:.75}
.fc-btn-ag{background:rgba(255,59,48,.12);color:#FF8080;border:1.5px solid rgba(255,59,48,.3)}
.fc-btn-kn{background:rgba(52,199,89,.12);color:#5AEA80;border:1.5px solid rgba(52,199,89,.3)}
/* done */
.stage-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.sd-emoji{font-size:64px;margin-bottom:14px}
.sd-title{font-size:22px;font-weight:700;margin-bottom:8px}
.sd-sub{font-size:14px;opacity:.6;margin-bottom:28px}
.sd-btn{border-radius:var(--r);padding:16px 32px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;width:100%;max-width:320px;min-height:54px}
.sd-btn:active{opacity:.85}
.sd-btn-next{background:var(--gr);color:#fff}
.sd-btn-rep{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
/* ── STAGE 2: MATCHING ── */
#s2{background:var(--bg)}
#s2 .st-back{background:rgba(0,0,0,.07);stroke:var(--t2)}
#s2 .st-prog{background:rgba(0,0,0,.1)}
#s2 .st-prog-fill{background:var(--pu)}
.m2-body{flex:1;overflow-y:auto;padding:10px 16px}
.m2-title{font-size:13px;font-weight:600;color:var(--t3);text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.4px}
.m2-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.m2-tile{background:var(--cd);border:2px solid var(--sep);border-radius:12px;padding:12px 10px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:center;line-height:1.3;transition:border-color .15s,background .15s;word-break:break-word}
.m2-tile:active{opacity:.8}
.m2-tile.sel{border-color:var(--pu);background:rgba(175,82,222,.08);color:var(--pu)}
.m2-tile.ok{border-color:var(--gr);background:rgba(52,199,89,.1);color:#1a7a34;pointer-events:none}
.m2-tile.wrong{border-color:var(--rd);background:rgba(255,59,48,.07);animation:shake .3s ease}
.m2-de-tile{color:var(--t1)}
.m2-ua-tile{color:var(--t2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ── STAGE 3: WRITING ── */
#s3{background:var(--bg)}
#s3 .st-back{background:rgba(0,0,0,.07);stroke:var(--t2)}
#s3 .st-prog{background:rgba(0,0,0,.1)}
#s3 .st-prog-fill{background:var(--or)}
.w3-body{flex:1;overflow-y:auto;padding:16px}
.w3-word{font-size:28px;font-weight:700;text-align:center;margin:8px 0 6px;color:var(--t1)}
.w3-ex{font-size:13px;color:var(--t3);text-align:center;margin-bottom:20px;font-style:italic;line-height:1.5}
.w3-input{width:100%;border:2px solid var(--sep);border-radius:12px;padding:14px 16px;font-size:18px;outline:none;background:var(--cd);color:var(--t1);margin-bottom:12px;transition:border-color .2s}
.w3-input:focus{border-color:var(--or)}
.w3-input.ok{border-color:var(--gr);background:rgba(52,199,89,.06)}
.w3-input.wrong{border-color:var(--rd);background:rgba(255,59,48,.05)}
.w3-btn{width:100%;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.w3-btn-check{background:var(--or);color:#fff}
.w3-btn-check:disabled{background:var(--sep);color:var(--t3);pointer-events:none}
.w3-btn-next{background:var(--gr);color:#fff}
.w3-btn-skip{background:transparent;color:var(--t3);padding:10px;font-size:14px;margin-top:6px}
.w3-feedback{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5}
.w3-feedback.ok{background:rgba(52,199,89,.1);border:1.5px solid var(--gr);color:#1a7a34}
.w3-feedback.wrong{background:rgba(255,59,48,.07);border:1.5px solid var(--rd);color:var(--rd)}
/* CONFETTI */
@keyframes conf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.cf{position:fixed;top:-10px;pointer-events:none;z-index:9999;animation:conf 2s ease-in both}

/* unit grid */
.unit{background:var(--cd);border-radius:var(--r);margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.unit-hdr{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.unit-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.unit-info{flex:1;min-width:0}
.unit-title{font-size:15px;font-weight:600;margin-bottom:4px}
.unit-bar-row{display:flex;align-items:center;gap:8px}
.unit-bar{flex:1;height:5px;background:var(--sep);border-radius:3px;overflow:hidden}
.unit-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.unit-pct{font-size:11px;color:var(--t3);min-width:30px;text-align:right}
.unit-btns{display:flex;gap:6px;padding:0 14px 12px}
.ubtn{flex:1;padding:10px 4px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;min-height:40px}
.ubtn:active{opacity:.75}
.ubtn-1{background:rgba(0,122,255,.08);color:var(--bl)}
.ubtn-2{background:rgba(175,82,222,.08);color:var(--pu)}
.ubtn-3{background:rgba(255,149,0,.08);color:var(--or)}
/* stage header */
.st-hdr2{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.st-back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;font-weight:700}
.st-back-btn:active{opacity:.7}
/* fc counter label */
.fc-cnt-label{text-align:center;font-size:12px;color:rgba(255,255,255,.4);margin-top:10px;width:100%;max-width:380px}

/* LANGUAGE SELECTOR */
.lang-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;z-index:10;-webkit-user-select:none;user-select:none}
.lang-btn:active{opacity:.75}
.lang-dropdown{position:absolute;top:50px;right:14px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);overflow:hidden;z-index:200;min-width:150px;display:none}
.lang-dropdown.open{display:block}
.lang-option{padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;color:#000}
.lang-option:active{background:#F2F2F7}
.lang-option.active{color:#007AFF}
.rtl-text{direction:rtl;text-align:right}
[dir="rtl"] .lang-btn{right:auto;left:14px}
[dir="rtl"] .lang-dropdown{right:auto;left:14px;text-align:right}
[dir="rtl"] .hdr-title,[dir="rtl"] .hdr-sub{padding-left:90px;padding-right:0}
[dir="rtl"] .hdr-row{direction:rtl}
</style>
</head>

  </div>
  <div class="st-body" id="st-body"></div>
  <div id="fc-btns" style="display:none"></div>
</div>

var S2={unit:null,pool:[],done:[],cur:[],matched:[],selDE:null,selUA:null};

function startStage2(unit){
  S2={unit:unit,pool:unit.words.map(function(_,i){return i;}),done:[],cur:[],matched:[],selDE:null,selUA:null};
  openStage('var(--bg)');
  buildHeader(unit.title,'\u041f\u0430\u0440\u0438',false);
  document.getElementById('fc-btns').style.display='none';
  nextS2Round();
}
function nextS2Round(){
  var rem=S2.pool.filter(function(i){return !S2.done.includes(i);});
  if(rem.length===0){
    setProgress(100,'#AF52DE');
    showDone('\ud83c\udf96\ufe0f','\u041f\u0430\u0440\u0438 \u0437\u0456\u0431\u0440\u0430\u043d\u043e!',S2.unit.words.length+' / '+S2.unit.words.length,'#AF52DE',null,null,false);
    cnf();return;
  }
  var pick=rem.slice(0,6).sort(function(){return Math.random()-.5;});
  S2.cur=pick;S2.matched=[];S2.selDE=null;S2.selUA=null;
  setProgress(Math.round(S2.done.length/S2.pool.length*100),'#AF52DE');
  renderS2();
}
function renderS2(){
  var words=S2.unit.words,cur=S2.cur,matched=S2.matched;
  var uaOrder=cur.slice().sort(function(){return Math.random()-.5;});
  var body=document.getElementById('st-body');
  var wrap=document.createElement('div');wrap.className='m2-body';
  var title=document.createElement('div');title.className='m2-title';
  title.textContent='\u0437\u0456\u0441\u0442\u0430\u0432 \u0441\u043b\u043e\u0432\u043e \u0437 \u043f\u0435\u0440\u0435\u043a\u043b\u0430\u0434\u043e\u043c';
  var grid=document.createElement('div');grid.className='m2-grid';
  S2._grid=grid;
  cur.forEach(function(idx,pos){
    var deT=document.createElement('div');
    deT.className='m2-tile m2-de-tile'+(matched.includes(idx)?' ok':'');
    deT.textContent=words[idx][0];
    if(!matched.includes(idx)){
      deT.addEventListener('click',function(){
        S2.selDE=idx;
        grid.querySelectorAll('.m2-de-tile:not(.ok)').forEach(function(x){x.classList.remove('sel');});
        deT.classList.add('sel');tryS2Match();
      });
    }
    grid.appendChild(deT);
    var uIdx=uaOrder[pos];
    var uaT=document.createElement('div');
    uaT.className='m2-tile m2-ua-tile'+(matched.includes(uIdx)?' ok':'');
    uaT.textContent=words[uIdx][1];
    uaT.setAttribute('data-idx',uIdx);
    if(!matched.includes(uIdx)){
      uaT.addEventListener('click',function(){
        S2.selUA=parseInt(uaT.getAttribute('data-idx'));
        grid.querySelectorAll('.m2-ua-tile:not(.ok)').forEach(function(x){x.classList.remove('sel');});
        uaT.classList.add('sel');tryS2Match();
      });
    }
    grid.appendChild(uaT);
  });
  wrap.appendChild(title);wrap.appendChild(grid);
  body.innerHTML='';body.appendChild(wrap);
}
function tryS2Match(){
  if(S2.selDE===null||S2.selUA===null)return;
  var de=S2.selDE,ua=S2.selUA;S2.selDE=null;S2.selUA=null;
  if(de===ua){
    S2.matched.push(de);if(!S2.done.includes(de))S2.done.push(de);
    if(S2._grid){
      S2._grid.querySelectorAll('.m2-de-tile').forEach(function(t){if(t.textContent===S2.unit.words[de][0])t.className='m2-tile m2-de-tile ok';});
      S2._grid.querySelectorAll('.m2-ua-tile').forEach(function(t){if(parseInt(t.getAttribute('data-idx'))===ua)t.className='m2-tile m2-ua-tile ok';});
    }
    if(S2.matched.length===S2.cur.length)setTimeout(nextS2Round,350);
  }else{
    if(S2._grid){
      S2._grid.querySelectorAll('.m2-de-tile.sel,.m2-ua-tile.sel').forEach(function(t){
        t.classList.remove('sel');t.classList.add('wrong');setTimeout(function(){t.classList.remove('wrong');},350);
      });
    }
  }
}

  function doCheck(){
    var val=(inp.value||'').toLowerCase().trim().replace(/\s+/g,' ');
    var correct=w[0];

    var mainW=cWords.filter(function(x){return!['der','die','das','ein','eine','sich','(sich)'].includes(x);}).join(' ');
    var ok=val===correct.toLowerCase()||val===mainW||(mainW.length>3&&val.length>=mainW.length-2&&mainW.startsWith(val));

    setTimeout(function(){inp.blur();},50);
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!btn.disabled)doCheck();});
  btn.addEventListener('click',doCheck);
  div.appendChild(inp);div.appendChild(btn);
  body.innerHTML='';body.appendChild(div);
  setTimeout(function(){inp.focus();},150);
}

    html+='<div class="unit-pct">'+known+'/'+wt+'</div></div></div></div>';
    html+='<div class="unit-btns">';
    html+='<button class="ubtn ubtn-1" data-uid="'+u.id+'" data-stage="1">'+t('cards')+'</button>';
    html+='<button class="ubtn ubtn-2" data-uid="'+u.id+'" data-stage="2">'+t('pairs')+'</button>';

  S3={unit:unit,queue:q,idx:0,correct:0,total:0};
  openStage('var(--bg)');
  var title=typeof unit.title==='function'?unit.title():unit.title;
  buildHeader(title,t('write'),false);
  document.getElementById('fc-btns').style.display='none';
  renderS3_i18n();
  ensureUnitTranslated(unit,function(){renderS3_i18n();});
};
function renderS3_i18n(){
  var q=S3.queue,unit=S3.unit;
  if(S3.idx>=q.length){
    var pct=S3.total>0?Math.round(S3.correct/S3.total*100):0;
    showDone('🏆',t('result'),S3.correct+' / '+S3.total+' ('+pct+'%)','#FF9500',null,null,false);
    cnf();return;
  }
  setProgress(Math.round(S3.idx/q.length*100),'#FF9500');
  var wi=q[S3.idx],w=unit.words[wi];
  var tr=wordTr(w);
  var body=document.getElementById('st-body');
  var div=document.createElement('div');div.className='w3-body';
  var wordEl=document.createElement('div');wordEl.className='w3-word';wordEl.textContent=tr;
  div.appendChild(wordEl);
  var exS3=wordExTr(w);if(exS3){var exEl=document.createElement('div');exEl.className='w3-ex';exEl.textContent=exS3;div.appendChild(exEl);}
  var inp=document.createElement('input');inp.type='text';inp.className='w3-input';
  inp.placeholder=t('writePrompt');
  inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');
  var btn=document.createElement('button');btn.className='w3-btn w3-btn-check';btn.textContent=t('checkBtn');btn.disabled=true;
  inp.addEventListener('input',function(){btn.disabled=inp.value.trim()==='';});
  function doCheck(){
    var val=(inp.value||'').toLowerCase().trim().replace(/\s+/g,' ');
    var correct=w[0];
    var cWords=correct.toLowerCase().split(/\s+/);
    var mainW=cWords.filter(function(x){return!['der','die','das','ein','eine','sich','(sich)'].includes(x);}).join(' ');
    var ok=val===correct.toLowerCase()||val===mainW||(mainW.length>3&&val.length>=mainW.length-2&&mainW.startsWith(val));
    S3.total++;if(ok)S3.correct++;
    inp.className='w3-input '+(ok?'ok':'wrong');btn.style.display='none';
    var fb=document.createElement('div');fb.className='w3-feedback '+(ok?'ok':'wrong');
    fb.textContent=ok?t('correct'):'✗ '+correct;div.appendChild(fb);
    var nb=document.createElement('button');nb.className='w3-btn w3-btn-next';nb.textContent=t('nextBtn');
    nb.addEventListener('click',function(){S3.idx++;renderS3_i18n();});div.appendChild(nb);
    setTimeout(function(){inp.blur();},50);
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!btn.disabled)doCheck();});
  btn.addEventListener('click',doCheck);
  var skipBtn=document.createElement('button');skipBtn.className='w3-btn w3-btn-skip';skipBtn.textContent=t('skipBtn');
  skipBtn.addEventListener('click',function(){S3.idx++;renderS3_i18n();});
  div.appendChild(inp);div.appendChild(btn);div.appendChild(skipBtn);
  body.innerHTML='';body.appendChild(div);
  setTimeout(function(){inp.focus();},150);
}
// Patch showDone to use i18n close button
var _origShowDone=showDone;
showDone=function(emoji,title,sub,color,repLabel,repFn,dark){
  var body=document.getElementById('st-body');
  var tc=dark?'#fff':'var(--t1)';var stc=dark?'rgba(255,255,255,.5)':'var(--t3)';
  var div=document.createElement('div');div.className='stage-done';
  div.innerHTML='<div class="sd-emoji">'+emoji+'</div>'+'<div class="sd-title" style="color:'+tc+'">'+H(title)+'</div>'+'<div class="sd-sub" style="color:'+stc+'">'+H(sub)+'</div>';
  var closeBtn=document.createElement('button');closeBtn.className='sd-btn';
  closeBtn.style.cssText='background:'+color+';color:#fff;margin-bottom:10px';
  closeBtn.textContent=t('toThemes');
  closeBtn.addEventListener('click',function(){closeStage();});div.appendChild(closeBtn);
  if(repLabel&&repFn){var repBtn=document.createElement('button');repBtn.className='sd-btn';repBtn.style.cssText='background:'+(dark?'rgba(255,255,255,.1)':'rgba(0,0,0,.06)')+';color:'+(dark?'rgba(255,255,255,.7)':'var(--t2)');repBtn.textContent=repLabel;repBtn.addEventListener('click',repFn);div.appendChild(repBtn);}
  body.innerHTML='';body.appendChild(div);
};

setLang(currentLang);
